<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Agricope POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pos.css">
<style>
  body {
    background: var(--green-900);
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob.b1 { width: 560px; height: 560px; background: rgba(21, 128, 61, 0.35); right: -160px; bottom: -200px; }
  .blob.b2 { width: 380px; height: 380px; background: rgba(220, 252, 231, 0.07); left: -120px; top: -100px; }

  .login-wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; position: relative; }

  .brand-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .brand-col .mark {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--green-500); color: var(--green-950);
    font-size: 26px; font-weight: 700;
    display: grid; place-items: center;
  }
  .brand-col .name { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 3px; }
  .brand-col .tag  { color: var(--green-300); font-size: 10px; font-weight: 500; letter-spacing: 3px; }

  .login-card {
    width: 400px;
    background: #fff;
    border-radius: 16px;
    padding: 28px 26px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: var(--shadow-pop);
  }
  .login-card h1 { font-size: 21px; font-weight: 600; }
  .login-card .sub { font-size: 13px; color: var(--slate-500); margin-top: 3px; }

  .foot { color: var(--green-300); font-size: 11px; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="login-wrap">
    <div class="brand-col">
      <div class="mark">A</div>
      <div class="name">AGRICOPE</div>
      <div class="tag">POINT OF SALE</div>
    </div>

    <div class="login-card">
      <div>
        <h1>Welcome back</h1>
        <div class="sub">Sign in to your business</div>
      </div>

      <div class="field">
        <label>Email</label>
        <div class="input">ayaan@agricope.qa</div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input">••••••••••</div>
      </div>

      <a class="btn btn-primary btn-big" href="dashboard.html">Sign in</a>
      <a class="btn btn-soft-green btn-big" href="register.html">Switch cashier with PIN</a>
    </div>

    <div class="foot">Agricope POS · v1.0</div>
  </div>
</body>
</html>
