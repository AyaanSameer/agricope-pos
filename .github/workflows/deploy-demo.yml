name: Deploy demo to GitHub Pages

# The demo runs entirely in the browser on MSW mocks — no backend, no database.
# Every push to main republishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        # VITE_BASE must match the path Pages serves from: /<repo>/.
        # VITE_USE_MOCKS is deliberately unset — the mocks ARE the demo.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback
        # Pages has no rewrite rules: it serves 404.html for any path it does not
        # recognise. Making that a copy of index.html means refreshing on
        # /orders boots the app instead of showing GitHub's 404 page.
        run: cp app/dist/index.html app/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
